<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Scientific calculator">
      <div
        id="display"
        class="display"
        role="status"
        aria-live="polite"
        aria-label="Display"
        data-placeholder="0"
      ></div>

      <div class="angle-switch" role="group" aria-label="Angle mode">
        <button
          type="button"
          class="angle-button"
          data-angle="deg"
          aria-pressed="true"
        >
          Degrees
        </button>
        <button
          type="button"
          class="angle-button"
          data-angle="rad"
          aria-pressed="false"
        >
          Radians
        </button>
      </div>

      <div class="keypad" role="group" aria-label="Keypad">
        <button type="button" class="key key--function" data-key="sin(">sin(</button>
        <button type="button" class="key key--function" data-key="cos(">cos(</button>
        <button type="button" class="key key--function" data-key="tan(">tan(</button>
        <button type="button" class="key key--function" data-key="log(">log(</button>
        <button type="button" class="key key--function" data-key="ln(">ln(</button>

        <button type="button" class="key key--function" data-key="√(">√(</button>
        <button type="button" class="key key--function" data-key="^">^</button>
        <button type="button" class="key key--function" data-key="(">(</button>
        <button type="button" class="key key--function" data-key=")">)</button>
        <button type="button" class="key key--function" data-key="C">C</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--operator" data-key="÷">÷</button>
        <button type="button" class="key key--function" data-key="⌫">⌫</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--operator" data-key="×">×</button>
        <button type="button" class="key key--operator" data-key="−">−</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key--operator" data-key="+">+</button>
        <button type="button" class="key key--equals" data-key="=">=</button>

        <button type="button" class="key key--wide" data-key="0">0</button>
        <button type="button" class="key" data-key=".">.</button>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
